services:

  supervisor:
    build: ./supervisor
    container_name: mdbank_supervisor_agents
    ports:
      - "8080:8000"
    volumes:
      - ./supervisor:/app

  frontend:
    build: ./frontend
    container_name: mdbank_frontend
    ports:
      - "9090:9090"
    volumes:
      - ./frontend:/app

  abrir_conta_agent:
    container_name: abrir_conta_agent
    build:
      context: ./agents/abrir_conta
    volumes:
      - ./agents/abrir_conta:/app
    ports:
      - "8081:8000"

  cartao_credito_agent:
    container_name: cartao_credito_agent
    build:
      context: ./agents/cartao_credito
    volumes:
      - ./agents/cartao_credito:/app
    ports:
      - "8082:8000"

  pagamentos_agent:
    container_name: pagamentos_agent
    build:
      context: ./agents/pagamentos
    volumes:
      - ./agents/pagamentos:/app
    ports:
      - "8086:8000"
    depends_on:
      - pix_mcp

  bfa:
    container_name: bfa
    build:
      context: ./bfa
    volumes:
      - ./bfa:/app
    ports:
      - "8083:8000"
    depends_on:
      - recursos
      - pix_mcp
      - supervisor
      - abrir_conta_agent
      - cartao_credito_agent
      - pagamentos_agent

  recursos:
    container_name: recursos
    build:
      context: ./recursos
    volumes:
      - ./recursos:/app
    ports:
      - "8084:8000"
  # Servidor MCP do Pix. O pix-service (repositório separado) roda FORA deste compose:
  # por padrão, no host, na porta 8089 (application.yml). Sobrescreva com PIX_SERVICE_URL
  # exportada no shell ou em um .env na raiz.
  pix_mcp:
    container_name: pix_mcp
    build:
      context: ./pix_mcp
    volumes:
      - ./pix_mcp:/app
    ports:
      - "8085:8000"
    environment:
      - PIX_SERVICE_URL=${PIX_SERVICE_URL:-http://host.docker.internal:8089}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - recursos

  frontend-ag-ui:
    build: ./frontend2
    container_name: frontend-ag-ui
    ports:
      - "3000:3000"
    volumes:
      - ./frontend2:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - CHOKIDAR_INTERVAL=1000
      - FAST_REFRESH=true
    command: npm start
